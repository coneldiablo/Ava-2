# Fixed pilot route. The private machine listener is never exposed here.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name alleya-resort-1.knowledge.meludtech.tech;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/alleya-resort-1.knowledge.meludtech.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alleya-resort-1.knowledge.meludtech.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    access_log off;
    error_log /var/log/nginx/ava-alleya-knowledge-entry-error.log crit;
    client_max_body_size 25m;
    location / {
        proxy_pass http://127.0.0.1:3042;
        proxy_http_version 1.1;
        proxy_set_header Host alleya-resort-1.knowledge.meludtech.tech;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ava_crm_workspace_connection;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }
}
