; Include from extensions_custom.conf. Existing Exolve endpoint must enter
; ava-exolve-managed only after exact legacy DID mappings have been verified.
[ava-exolve-managed]
exten => s,1,Hangup(1)
exten => _X!,1,Gosub(ava-managed-resolve,s,1(${EXTEN}))
 same => n,Hangup()
exten => _+X!,1,Gosub(ava-managed-resolve,s,1(${EXTEN}))
 same => n,Hangup()

[ava-managed-resolve]
exten => s,1,Set(AVA_DID=${FILTER(0-9+,${ARG1})})
 same => n,GotoIf($[${LEN(${AVA_DID})}!=${LEN(${ARG1})}]?reject)
 same => n,GotoIf($[${REGEX("^[+]?[78]?[0-9]{10}$" ${AVA_DID})}=0]?reject)
 same => n,Set(CURLOPT(conntimeout)=1)
 same => n,Set(CURLOPT(httptimeout)=1)
 same => n,Set(AVA_ROUTE=${CURL(http://127.0.0.1:8097/resolve/${AVA_DID})})
 same => n,Set(AAVA_BUSINESS_ID=${CUT(AVA_ROUTE,|,1)})
 same => n,Set(AAVA_PHONE_ID=${CUT(AVA_ROUTE,|,2)})
 same => n,Set(DIALED_NUMBER=${CUT(AVA_ROUTE,|,3)})
 same => n,GotoIf($["${AAVA_BUSINESS_ID}"="" | "${AAVA_PHONE_ID}"="" | "${DIALED_NUMBER}"=""]?reject)
 same => n,Set(__AAVA_MANAGED_INGRESS=1)
 same => n,Set(__AAVA_BUSINESS_ID=${AAVA_BUSINESS_ID})
 same => n,Set(__AAVA_INSTANCE_ID=${AAVA_BUSINESS_ID})
 same => n,Set(__AAVA_PHONE_ID=${AAVA_PHONE_ID})
 same => n,Set(__FROM_DID=${DIALED_NUMBER})
 same => n,Progress()
 same => n,Gosub(ava-managed-record,s,1)
 same => n,Stasis(asterisk-ai-voice-agent)
 same => n,Return()
 same => n(reject),Hangup(1)

; Record the actual caller channel, including the employee conversation after
; transfer. No shell command, caller name or caller-provided filename is used.
; This directory must match the read-only recordings mount of admin UI.
[ava-managed-record]
exten => s,1,Set(AAVA_RECORDING_STARTED=)
 same => n,Set(AAVA_MIXMONITOR_ID=)
 same => n,GotoIf($[${REGEX("^[1-9][0-9]*$" ${AAVA_BUSINESS_ID})}=0]?reject)
 same => n,GotoIf($[${REGEX("^[a-zA-Z0-9_.-]+$" ${UNIQUEID})}=0]?reject)
 same => n,MixMonitor(/var/spool/asterisk/monitor/ava-${AAVA_BUSINESS_ID}-${UNIQUEID}.wav,i(AAVA_MIXMONITOR_ID))
 same => n,GotoIf($["${AAVA_MIXMONITOR_ID}"=""]?reject)
 same => n,Set(__AAVA_RECORDING_STARTED=1)
 same => n,Return()
 same => n(reject),Hangup(21)

[ava-managed-outbound-record]
exten => s,1,Gosub(ava-managed-record,s,1)
 same => n,Stasis(asterisk-ai-voice-agent,outbound_recorded,${AAVA_ATTEMPT_ID})
 same => n,Hangup()

[ava-managed-sip-reject]
exten => s,1,Hangup(21)
exten => _X!,1,Hangup(21)
exten => _+X!,1,Hangup(21)
