# Install only after a verified backup and certificate issuance for this exact
# host. Do not replace existing AVA or wildcard CRM server blocks.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name auth.meludtech.tech;
    ssl_certificate /etc/letsencrypt/live/auth.meludtech.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auth.meludtech.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    access_log off;
    error_log /var/log/nginx/ava-identity-error.log crit;
    client_max_body_size 32k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    # No management port, master realm, Admin UI, or Admin API on the public
    # listener. Worker admin calls use the separate internal Docker network;
    # browser enrollment reaches only the worker's restricted enrollment API.
    location /realms/ava/ {
        proxy_pass http://127.0.0.1:8084;
        proxy_set_header Host auth.meludtech.tech;
        proxy_set_header X-Forwarded-Host auth.meludtech.tech;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
    location /resources/ {
        proxy_pass http://127.0.0.1:8084;
        proxy_set_header Host auth.meludtech.tech;
    }
    location / { return 404; }
}
