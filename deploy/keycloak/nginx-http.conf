# Exact-host challenge route. Does not change existing AVA/module routes.
server {
    listen 80;
    listen [::]:80;
    server_name auth.meludtech.tech;
    server_tokens off;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://auth.meludtech.tech$request_uri; }
}
