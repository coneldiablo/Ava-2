# Review alongside existing exact hosts before installation. Do not remove
# existing customer routes. Nginx exact names take precedence over this wildcard.
server {
    listen 80;
    listen [::]:80;
    server_name *.crm.meludtech.tech;
    access_log off;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        try_files $uri =404;
    }
    location / { return 404; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name *.crm.meludtech.tech;
    ssl_reject_handshake on;
    access_log off;
    return 404;
}
