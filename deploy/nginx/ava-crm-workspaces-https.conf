# Deliberately enumerate issued workspace hosts. Never route an arbitrary
# wildcard hostname to the legacy/default hotel workspace.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name app.crm.meludtech.tech ava-hotels.crm.meludtech.tech;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/ava-crm-workspaces/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ava-crm-workspaces/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    ssl_session_cache shared:AVACRMSSL:10m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    access_log /var/log/nginx/ava-crm-workspaces-access.log ava_crm_workspace_safe;
    error_log /var/log/nginx/ava-crm-workspaces-error.log crit;
    client_max_body_size 100m;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ava_crm_workspace_connection;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
}
