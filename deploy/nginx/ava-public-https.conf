# All AVA runtime services are local to this VDS. TLS terminates at nginx;
# upstream application ports are bound to loopback only.
map $host $ava_local_backend {
    ai.meludtech.tech http://127.0.0.1:3003;
    wh.meludtech.tech http://127.0.0.1:3011;
    default http://127.0.0.1:3003;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # Same authenticated application and certificate on the already-open
    # HTTPS fallback port; does not expose any internal application port.
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name ai.meludtech.tech wh.meludtech.tech;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/ava-public-domains/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ava-public-domains/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    ssl_session_cache shared:AVADOMAINSSL:10m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    access_log /var/log/nginx/ava-public-access.log ava_public_safe;
    error_log /var/log/nginx/ava-public-error.log crit;
    client_max_body_size 50m;

    include /etc/nginx/snippets/ava-module-access-location.conf;

    location / {
        proxy_pass $ava_local_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Discard client-supplied forwarding chains at the public boundary.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
