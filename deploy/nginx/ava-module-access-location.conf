# Include inside AVA's HTTPS server block. A cross-origin HTML form POST
# needs a non-null Origin for the native gateway's strict CSRF check.
# strict-origin sends only https://wh.meludtech.tech, never a URL/query/code.
location = /module-access {
    proxy_pass $ava_local_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_hide_header Referrer-Policy;
    add_header Referrer-Policy strict-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control no-store always;
    proxy_connect_timeout 10s;
    proxy_read_timeout 30s;
}
