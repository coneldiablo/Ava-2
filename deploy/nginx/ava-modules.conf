# Public entry points for the modules of the single-host AVA product.
# Application/API ports stay bound to loopback. Native authentication is retained.
map $http_upgrade $ava_module_connection {
    default upgrade;
    '' close;
}
map $host $ava_module_backend {
    crm.meludtech.tech http://127.0.0.1:3000;
    knowledge.meludtech.tech http://127.0.0.1:3080;
    default http://127.0.0.1:3000;
}
# Existing API clients keep their old base URL during migration. Browser routes
# use the native multi-workspace entry point; this is not authentication bypass.
map "$host:$uri" $ava_crm_legacy_ui_redirect {
    default 0;
    ~^crm\.meludtech\.tech:/(?:rest|metadata|graphql|admin-panel|healthz)(?:/|$) 0;
    ~^crm\.meludtech\.tech: 1;
}
# Do not log paths, query strings, cookies or Authorization: native auth/invite
# routes can contain single-use tokens. Application audit remains separate.
log_format ava_module_safe '$remote_addr [$time_local] $host $request_method '
                           '$status upstream=$upstream_status duration=$request_time';

server {
    listen 80;
    listen [::]:80;
    server_name crm.meludtech.tech knowledge.meludtech.tech;
    server_tokens off;
    access_log /var/log/nginx/ava-modules-access.log ava_module_safe;
    error_log /var/log/nginx/ava-modules-error.log crit;
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
        try_files $uri =404;
    }
    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # Same protected service on the existing HTTPS fallback port.
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name crm.meludtech.tech knowledge.meludtech.tech;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/ava-product-modules/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ava-product-modules/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    ssl_session_cache shared:AVAMODULESSL:10m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    access_log /var/log/nginx/ava-modules-access.log ava_module_safe;
    error_log /var/log/nginx/ava-modules-error.log crit;
    client_max_body_size 100m;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    # The edge, not an untrusted client, establishes forwarding metadata.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $ava_module_connection;
    proxy_connect_timeout 10s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        proxy_pass $ava_module_backend;
        if ($ava_crm_legacy_ui_redirect) {
            return 307 https://app.crm.meludtech.tech$request_uri;
        }
        proxy_buffering on;
    }

    # Onyx v4.7.0 streams chat answers on this path (stream=true is the default).
    location = /api/chat/send-chat-message {
        proxy_pass $ava_module_backend;
        if ($ava_crm_legacy_ui_redirect) {
            return 307 https://app.crm.meludtech.tech$request_uri;
        }
        proxy_buffering off;
    }

    location ~ ^/api/chat/chat-session/[^/]+/resume-stream$ {
        proxy_pass $ava_module_backend;
        if ($ava_crm_legacy_ui_redirect) {
            return 307 https://app.crm.meludtech.tech$request_uri;
        }
        proxy_buffering off;
    }

    # Incremental audio and image generation need chunks to reach the client.
    location = /api/voice/synthesize {
        proxy_pass $ava_module_backend;
        if ($ava_crm_legacy_ui_redirect) {
            return 307 https://app.crm.meludtech.tech$request_uri;
        }
        proxy_buffering off;
    }

    location = /api/image-generation/generate {
        proxy_pass $ava_module_backend;
        if ($ava_crm_legacy_ui_redirect) {
            return 307 https://app.crm.meludtech.tech$request_uri;
        }
        proxy_buffering off;
    }

    # Craft live events: scheduled runs, subagent replies and interactive turns.
    location ~ ^/api/build/sessions/[^/]+/(scheduled-run-events|subagents/[^/]+/send-message|turns/[^/]+/events)$ {
        proxy_pass $ava_module_backend;
        if ($ava_crm_legacy_ui_redirect) {
            return 307 https://app.crm.meludtech.tech$request_uri;
        }
        proxy_buffering off;
    }

    location = /api/build/debug/opencode-logs/stream {
        proxy_pass $ava_module_backend;
        if ($ava_crm_legacy_ui_redirect) {
            return 307 https://app.crm.meludtech.tech$request_uri;
        }
        proxy_buffering off;
    }
}
