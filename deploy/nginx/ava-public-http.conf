# Included inside nginx's http block. Public DNS now points to the new VDS.
map $uri $ava_safe_log_path {
    ~*^/api/integrations/(bnovo|twenty)/webhooks(?:/|$) /api/integrations/webhooks/REDACTED;
    default $uri;
}
log_format ava_public_safe '$remote_addr [$time_local] "$request_method $ava_safe_log_path" $status upstream=$upstream_status';

server {
    listen 80;
    listen [::]:80;
    server_name ai.meludtech.tech wh.meludtech.tech;
    server_tokens off;
    access_log /var/log/nginx/ava-public-access.log ava_public_safe;
    error_log /var/log/nginx/ava-public-error.log crit;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://$host$request_uri; }
}
