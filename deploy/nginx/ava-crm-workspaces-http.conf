# HTTP-01 lets the operator issue per-workspace certificates without keeping
# DNS-provider credentials on the application server. Wildcard DNS is required.
log_format ava_crm_workspace_safe '$remote_addr [$time_local] $host $request_method '
                                  '$status upstream=$upstream_status duration=$request_time';
map $http_upgrade $ava_crm_workspace_connection {
    default upgrade;
    '' close;
}
server {
    listen 80;
    listen [::]:80;
    server_name *.crm.meludtech.tech;
    server_tokens off;
    access_log /var/log/nginx/ava-crm-workspaces-access.log ava_crm_workspace_safe;
    error_log /var/log/nginx/ava-crm-workspaces-error.log crit;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://$host$request_uri; }
}
